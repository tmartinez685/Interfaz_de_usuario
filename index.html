<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New Portal U Remaster · UNAB</title>
<meta name="description" content="Portal del estudiante UNAB: toda tu información universitaria, clara y en un solo lugar.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
</head>
<body class="page-login" data-root="" data-active="inicio">
<div id="site-header"></div>

<main id="contenido">
  <section class="hero" aria-labelledby="titulo">
    <div class="hero__grid">
      <div class="intro">
        <p class="eyebrow">PORTAL DEL ESTUDIANTE</p>
        <h1 id="titulo">The New Portal U <span>Remaster</span></h1>
        <p class="lead">Toda tu información universitaria, clara y en un solo lugar</p>

        <form class="login-form" id="login-form" novalidate>
          <div class="fields">
            <input class="field field--user" id="usuario" name="usuario" type="text" placeholder="Usuario" aria-label="Usuario" autocomplete="username" required>
            <input class="field field--pass" id="clave" name="clave" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
          </div>
          <div><button class="btn-enter" type="submit">Ingresar</button></div>
          <div class="help-links">
            <a href="pages/solicitar-usuario.html">No tienes Usuario?</a>
            <a href="pages/recuperar.html">Se te olvido tu contraseña?</a>
          </div>
          <p class="form-msg" id="login-msg" role="alert" aria-live="assertive"></p>
        </form>
      </div>

      <div class="hero__img"><img src="assets/img/hero-edificio.jpg" alt="Edificio UNAB"></div>
    </div>
  </section>

  <section class="photos" aria-label="Vida universitaria">
    <div class="wrap">
      <div class="photo photo--outlined"><img src="assets/img/foto-estudiantes.jpg" alt="Grupo de estudiantes UNAB" loading="lazy"></div>
      <div class="photo"><img src="assets/img/foto-deporte.jpg" alt="Estudiantes en actividad deportiva" loading="lazy"></div>
      <div class="photo"><img src="assets/img/foto-campus.jpg" alt="Edificio del campus UNAB" loading="lazy"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/layout.js"></script>
<script src="js/login.js"></script>
</body>
</html>
