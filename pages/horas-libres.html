<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horas libres · Portal UNAB</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/pages.css">
<script src="../js/data.js"></script>
<script src="../js/auth.js" data-guard data-root="../"></script>
</head>
<body data-root="../" data-active="horas-libres">
<div id="site-header"></div>

<main id="contenido">
  <div class="strip-orange" style="--h:78px"></div>

  <div class="wrap gutter-wide" style="padding-top:19px">
    <section class="hours-card" aria-labelledby="h-horas">
      <div class="hours-card__text">
        <h2 id="h-horas">Tus horas libres</h2>
        <p class="status" id="horas-estado">Llevas <strong>--</strong> horas de <strong>--</strong> horas</p>
        <div class="progress" aria-hidden="true"><span id="horas-barra" style="width:0"></span></div>
        <button class="btn-detail" id="btn-detalle" type="button" aria-expanded="false" aria-controls="horas-detalle">
          <span>Ver detalle</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
      <div class="hours-card__chart">
        <svg id="chart" viewBox="0 0 1180 380" role="img" aria-label="Horas libres obtenidas por mes, de enero a octubre"></svg>
      </div>
      <div class="hours-detail" id="horas-detalle" hidden></div>
    </section>

    <section class="events" aria-labelledby="h-eventos">
      <h2 id="h-eventos">Próximas actividades</h2>
      <div class="events__grid" id="eventos"></div>
    </section>
  </div>

  <div style="height:56px"></div>
</main>

<div id="site-footer"></div>
<script src="../js/layout.js"></script>
<script src="../js/charts.js"></script>
</body>
</html>
