<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis notas · Portal UNAB</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/pages.css">
<script src="../js/data.js"></script>
<script src="../js/auth.js" data-guard data-root="../"></script>
</head>
<body data-root="../" data-active="notas">
<div id="site-header"></div>

<main id="contenido">
  <div class="strip-orange" style="--h:44px"></div>
  <section class="title-band">
    <div class="wrap">
      <div class="title-band__main">
        <h1 class="page-title">Mis Notas</h1>
        <svg class="title-band__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      </div>
      <a class="btn-back" href="menu.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Atrás</a>
    </div>
  </section>

  <div class="wrap grades gutter-wide">
    <section class="grades__panel panel-purple" aria-labelledby="h-semestre">
      <h2 id="h-semestre">Semestre actual</h2>
      <div class="grades-scroll">
        <table class="grades-table">
          <colgroup><col style="width:24%"><col style="width:25.6%"><col style="width:24.4%"><col style="width:26%"></colgroup>
          <thead>
            <tr><th class="c-subject" scope="col">Materia</th><th class="c-c1" scope="col">Corte 1</th><th class="c-c2" scope="col">Corte 2</th><th class="c-final" scope="col">Definitiva</th></tr>
          </thead>
          <tbody id="notas-cuerpo"></tbody>
        </table>
      </div>
    </section>

    <aside class="student-card" aria-label="Datos del estudiante">
      <div class="student-card__avatar"><img id="est-foto" src="../assets/img/avatar.png" alt="Foto del estudiante"></div>
      <p class="name" id="est-nombre"></p>
      <p class="course" id="est-curso"></p>
      <p class="meta" id="est-id"></p>
      <p class="meta" id="est-semestre"></p>
      <p class="avg" id="est-promedio"></p>
    </aside>
  </div>
</main>

<div id="site-footer"></div>
<script src="../js/layout.js"></script>
<script src="../js/notas.js"></script>
</body>
</html>
